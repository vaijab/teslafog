[platformio]
default_envs = uno_fog

[env]
monitor_speed = 115200

; Every target board is the same Uno with the same MCP2515 module, so the
; per-environment blocks differ only in which sketch they compile.
[uno_base]
platform = atmelavr
board = uno
framework = arduino
lib_deps = autowp/autowp-mcp2515

; The deployed controller: uv run pio run -t upload
[env:uno_fog]
extends = uno_base
build_src_filter = -<*> +<teslafog_uno.cpp>

; MCP2515 bring-up and loopback self-test: uv run pio run -e uno -t upload
[env:uno]
extends = uno_base
build_src_filter = -<*> +<bringup_uno.cpp>

; Bus scanner, listen-only: uv run pio run -e uno_scan -t upload
[env:uno_scan]
extends = uno_base
build_src_filter = -<*> +<scan_uno.cpp>

; Per-bit change detector, listen-only: uv run pio run -e uno_sniff -t upload
[env:uno_sniff]
extends = uno_base
monitor_speed = 500000
build_src_filter = -<*> +<sniff_uno.cpp>

; Decode the three messages of interest, listen-only
[env:uno_capture]
extends = uno_base
build_src_filter = -<*> +<capture_uno.cpp>

; TRANSMITS a modified 0x273 on command: uv run pio run -e uno_inject -t upload
[env:uno_inject]
extends = uno_base
build_src_filter = -<*> +<injecttest_uno.cpp>

; Host-side compliance tests: uv run pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra
